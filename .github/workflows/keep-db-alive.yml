name: Keep database alive

on:
  schedule:
    # Segunda e quinta às 09:00 UTC — mantém um intervalo máximo de ~4 dias
    # entre execuções, com folga segura antes do limite de 7 dias de
    # inatividade em que o Supabase pausa projetos no plano gratuito.
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar health-check do backend (executa query no banco)
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" "$BACKEND_HEALTH_URL")
          echo "HTTP status: $status"
          cat /tmp/response.json
          echo
          if [ "$status" -ne 200 ]; then
            echo "Health-check falhou (status $status)"
            exit 1
          fi
        env:
          BACKEND_HEALTH_URL: https://gestao-milhas.onrender.com/api/health
